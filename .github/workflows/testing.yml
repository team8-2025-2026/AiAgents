name: Python services

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  authapi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r authapi/requirements.txt
    - name: Prepare test environment variables
      run: |
        echo "CONNECTION_STRING=sqlite:///database.db" >> $GITHUB_ENV
        echo "ADMIN_ACCESS_TOKEN=1234567890" >> $GITHUB_ENV
    - name: Test with pytest
      run: |
        cd authapi; python -m pytest
  chatapi:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r chatapi/requirements.txt
    - name: Test with pytest
      run: |
        cd chatapi; python -m pytest
